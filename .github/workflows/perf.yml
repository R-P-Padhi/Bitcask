name: Reproducible performance benchmarks

on:
  push:
    branches: [main, perf-benchmarks-2026]
    paths:
      - examples/perf.rs
      - .github/workflows/perf.yml
  workflow_dispatch:

jobs:
  benchmark:
    name: Linux release benchmark (Rust 1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release --example perf
      - name: Measure three independent workload trials
        run: |
          for trial in 1 2 3; do
            echo "PERF_TRIAL|$trial"
            /usr/bin/time -v ./target/release/examples/perf
          done
